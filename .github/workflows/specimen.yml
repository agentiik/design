name: specimen

# The specimen sheet rendered on each ground and compared, pixel for pixel, with the references
# in tests/specimen, so that a token edit shows here as the change it makes and a change nobody
# asked for fails. A change that was asked for commits new references with it.
#
# The job runs in the Playwright image at the version package.json pins, because text is
# antialiased by whatever the machine has: a reference is only comparable with a render from
# the same image. On a failure the renders and the differences are kept as an artifact, which
# is also where a new reference comes from, rather than from anybody's own machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specimen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: The specimen on both grounds is what it was
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: specimen-renders
          path: |
            test-results/
            tests/specimen/
          if-no-files-found: ignore
